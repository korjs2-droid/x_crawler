<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>X Crawler Login</title>
    <style>
      :root {
        --bg: #f7f6f2;
        --card: #ffffff;
        --text: #1f2937;
        --muted: #6b7280;
        --brand: #0f766e;
        --line: #d1d5db;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: "Pretendard", "Noto Sans KR", sans-serif;
        background: radial-gradient(circle at top right, #d1fae5, var(--bg));
        color: var(--text);
      }
      .card {
        width: 100%;
        max-width: 420px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 18px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 24px;
      }
      p {
        margin: 0 0 12px;
        color: var(--muted);
        font-size: 14px;
      }
      input {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px;
        box-sizing: border-box;
      }
      button {
        margin-top: 10px;
        border: none;
        background: var(--brand);
        color: white;
        border-radius: 10px;
        padding: 11px 14px;
        cursor: pointer;
      }
      .error {
        color: #b91c1c;
        font-size: 14px;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>X Crawler</h1>
      <p>웹 접근 비밀번호를 입력하세요.</p>
      <form method="post">
        <input type="password" name="web_password" placeholder="비밀번호" required />
        <button type="submit">로그인</button>
      </form>
      {% if error %}
      <div class="error">{{ error }}</div>
      {% endif %}
    </div>
  </body>
</html>
